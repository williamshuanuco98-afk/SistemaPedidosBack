server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/inplabel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================================
# 1. HIKARICP POOL RESILIENCIA & TIMEOUTS (Prevención de saturación DB)
# =========================================================================
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================================
# 2. TOMCAT HARDENING & SLOWLORIS PROTECTION (Punto 5)
# =========================================================================
# Control de Hilos y Conexiones Concurrentes
server.tomcat.max-connections=1000
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# Timeouts estrictos contra ataques de conexión lenta (Slowloris)
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=15000
server.tomcat.max-keep-alive-requests=100

# Límites de cabecera y tamaño de payload (Prevención de desbordamiento de memoria)
server.max-http-request-header-size=8KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================================
# 3. TOKENS DE APIS EXTERNAS
# =========================================================================
decolecta.api.token=${DECOLECTA_API_TOKEN:}
sunat.api.token=${SUNAT_API_TOKEN:}
