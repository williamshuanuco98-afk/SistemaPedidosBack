server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/inplabel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Decolecta / SUNAT API Token Configuration (Securely stored on Backend)
decolecta.api.token=${DECOLECTA_API_TOKEN:}
sunat.api.token=${SUNAT_API_TOKEN:}
